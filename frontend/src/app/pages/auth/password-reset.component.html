<div class="relative sid-auth-shell sid-auth-shell--login overflow-hidden">
  <div class="pointer-events-none fixed inset-0 z-0 bg-[#0a0a0a]" aria-hidden="true"></div>
  <div
    class="pointer-events-none fixed inset-0 z-0 bg-cover bg-center bg-no-repeat"
    style="background-image: url('assets/login-bg.png')"
    aria-hidden="true"
  ></div>
  <div class="pointer-events-none fixed inset-0 z-0 bg-black/70" aria-hidden="true"></div>

  <div class="relative z-10 w-full max-w-lg px-4 sm:max-w-md">
    <div class="sid-hero-premium mb-8 flex flex-col items-center text-center">
      <app-sidep-brand-lockup class="w-full max-w-sm px-2" variant="hero" [subline]="nombreCompaniaTag() ?? 'Compañía'" />
      <h1 class="sr-only">SIDEP · restablecer contraseña</h1>
    </div>

    <div class="sid-glass-panel sid-panel rounded-xl border border-gray-700/80 bg-[#121212]/90 p-8 backdrop-blur-sm">
      <h2 class="sid-title-balanced mb-2 text-2xl font-bold text-white">Restablecer contraseña</h2>

      @if (ok) {
        <div class="rounded-lg border border-green-700 bg-green-900/20 px-4 py-3 text-sm text-green-300">
          Contraseña actualizada correctamente. Ya puedes iniciar sesión con tu nueva clave.
        </div>
        <a routerLink="/login" class="sid-btn sid-btn-primary mt-6 inline-flex w-full items-center justify-center rounded-lg py-3 font-medium">
          Ir al login
        </a>
      } @else {
        <p class="mb-5 text-sm text-gray-400">Elige una contraseña nueva de al menos 8 caracteres.</p>

        @if (error) {
          <div class="mb-4 rounded-lg border border-red-700 bg-red-900/20 px-4 py-3 text-sm text-red-300" role="alert">
            {{ error }}
          </div>
        }

        <div class="space-y-5">
          <div>
            <label class="mb-2 block text-sm font-medium text-gray-300">Nueva contraseña</label>
            <div class="relative">
              <lucide-icon
                name="lock"
                class="pointer-events-none absolute left-3 top-1/2 h-5 w-5 -translate-y-1/2 text-gray-400"
                [size]="20"
                color="currentColor"
              ></lucide-icon>
              <input
                [(ngModel)]="password"
                type="password"
                autocomplete="new-password"
                placeholder="••••••••"
                class="sid-input box-border w-full !rounded-lg !border-gray-700 !bg-[#0a0a0a] !py-3 !pl-12 !pr-4 placeholder:text-gray-500"
              />
            </div>
          </div>

          <div>
            <label class="mb-2 block text-sm font-medium text-gray-300">Confirmar contraseña</label>
            <div class="relative">
              <lucide-icon
                name="lock"
                class="pointer-events-none absolute left-3 top-1/2 h-5 w-5 -translate-y-1/2 text-gray-400"
                [size]="20"
                color="currentColor"
              ></lucide-icon>
              <input
                [(ngModel)]="confirm"
                type="password"
                autocomplete="new-password"
                placeholder="••••••••"
                class="sid-input box-border w-full !rounded-lg !border-gray-700 !bg-[#0a0a0a] !py-3 !pl-12 !pr-4 placeholder:text-gray-500"
              />
            </div>
          </div>

          <button
            type="button"
            [disabled]="loading"
            class="sid-btn sid-btn-primary w-full rounded-lg py-3 font-medium disabled:opacity-60"
            (click)="guardar()"
          >
            {{ loading ? 'Guardando...' : 'Guardar nueva contraseña' }}
          </button>
        </div>

        <a routerLink="/login" class="sid-link-clean mt-6 inline-block text-sm">Volver al login</a>
      }
    </div>
  </div>
</div>
