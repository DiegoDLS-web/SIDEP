<div class="sid-page sid-page-shell w-full min-w-0">
  <div class="flex flex-wrap items-center justify-between gap-4 border-b border-slate-800/80 pb-5">
    <div>
      <a routerLink="/" class="sid-back-link mb-2">
        <lucide-icon name="arrow-left" class="h-4 w-4" [size]="16" color="currentColor" />
        Volver al inicio
      </a>
      <h1 class="text-2xl font-bold tracking-tight text-white sm:text-3xl">Módulo de Auditoría</h1>
      <p class="text-sm text-slate-500">
        Monitoreo, validación visual y detección de inconsistencias del sistema SIDEP.
      </p>
    </div>
  </div>

  <nav class="flex flex-wrap gap-2 rounded-2xl border border-slate-850 bg-[#121212] p-2">
    @for (tab of tabs; track tab.path) {
      <a
        [routerLink]="tab.path"
        routerLinkActive="bg-red-600/20 text-red-200 ring-1 ring-red-500/40"
        class="inline-flex items-center gap-2 rounded-xl px-4 py-2.5 text-xs font-semibold text-slate-400 transition-colors hover:bg-slate-800 hover:text-white"
      >
        <lucide-icon [name]="tab.icon" class="h-4 w-4" [size]="16" color="currentColor" />
        {{ tab.label }}
      </a>
    }
  </nav>

  <router-outlet />
</div>
